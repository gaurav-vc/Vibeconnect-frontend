<!doctype html>

    <title>VibeConnect</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

              "on-primary": "#ffffff",
              "primary-container": "#f4c2c2",
              "on-primary-container": "#734e4e",

    <link rel="preconnect" href="https://fonts.googleapis.com">
